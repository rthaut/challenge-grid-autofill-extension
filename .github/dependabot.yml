version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        versions:
          - ">=7"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        # 0.x packages can ship breaking changes in minor releases, so these
        # get their own PRs.
        exclude-patterns:
          - wxt
          - "@types/chrome"
          - sharp
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
